# Configuración del proceso. Las rutas son relativas a la raíz del repositorio.

# Fuente de datos:
#   synthetic   - Plan C: datos simulados con estructura OCDS y patrones de riesgo sembrados
#                 (por defecto; no necesita internet)
#   oece        - Plan A: publicación OCDS del OECE en el registro de datos de Open Contracting Partnership
#   perucompras - Plan B: publicación OCDS de Perú Compras en el mismo registro
#   auto        - intenta oece, luego perucompras, y si ambas fallan usa datos simulados
source: synthetic

years: [2024, 2025]          # años completos más recientes
currency: PEN

paths:
  raw_dir: data/raw          # ignorado por git; aquí caen las descargas y los datos simulados completos
  sample_dir: data/sample    # muestras pequeñas versionadas
  warehouse: data/warehouse/procurement.duckdb   # ignorado por git
  outputs: outputs           # resultados agregados y versionados
  docs: docs                 # fuente del sitio MkDocs

# Descargas del registro de datos de Open Contracting Partnership (Planes A y B).
# El registro entrega un archivo JSON Lines comprimido por año y por publicación:
#   https://data.open-contracting.org/en/publication/<id>/download?name=<año>.jsonl.gz
# (comprobado en el código fuente del registro, github.com/open-contracting/data-registry,
#  el 2026-11-04: responde 400 si el nombre no es válido, 404 si ese archivo no existe y redirige
#  al servidor de descargas si existe). Cada línea es una «compiled release» de OCDS.
registry:
  base_url: "https://data.open-contracting.org/en/publication/{publication_id}/download?name={name}"
  publications_api: "https://data.open-contracting.org/en/publications.json"
  publications:
    oece:
      publication_id: 135
      label: "OECE (ex OSCE), sistema SEACE"
      status: provided_by_owner   # dato entregado por el dueño del proyecto el 2026-11-04
    perucompras:
      publication_id: 78
      label: "Perú Compras (acuerdos marco)"
      status: provided_by_owner
  retries: 5                 # reintentos por archivo ante cortes o errores 5xx
  timeout_seconds: 120       # tiempo máximo sin recibir datos

privacy:
  # Las personas naturales (RUC que empieza con 10, 15 o 17, o identificadores DNI) se reemplazan
  # por un seudónimo con HMAC-SHA256 antes de escribir nada en el almacén. La clave sale de esta
  # variable de entorno; si no está definida se usa una clave de demostración pública y se avisa.
  salt_env_var: PROCONTROL_SALT
  natural_person_ruc_prefixes: ["10", "15", "17"]

synthetic:
  seed: 20251231
  n_buyers: 40
  n_suppliers: 900
  natural_person_share: 0.18
  processes_per_buyer_year: 150

validation:
  review_sample_size: 20
  review_seed: 7

site:
  # Mínimo de entidades por grupo en cualquier vista agregada: un grupo con menos entidades
  # se fusiona en «Otras entidades» para que ninguna se pueda identificar.
  min_entities_per_group: 3
