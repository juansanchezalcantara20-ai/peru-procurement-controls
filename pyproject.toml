[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "procontrol"
version = "0.1.0"
description = "Continuous-control analytics on Peruvian public procurement (OCDS): data quality, a control catalog and a signal engine."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Juan Luis Sánchez Alcántara" }]
dependencies = [
  "duckdb>=1.1",
  "pandas>=2.2",
  "pyyaml>=6.0",
  "matplotlib>=3.8",
  "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mkdocs-material>=9.5"]

[project.scripts]
procontrol = "procontrol.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["SIM108"]

[tool.ruff.lint.per-file-ignores]
# long SQL and Markdown templates
"src/procontrol/report.py" = ["E501"]
"src/procontrol/powerbi.py" = ["E501"]
