name: CI

on:
  push:
  pull_request:

jobs:
  build:
    name: Pruebas, proceso con datos simulados y revisiones del sitio
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Instalar
        run: python -m pip install -e ".[dev]"
      - name: Revisión de estilo del código
        run: python -m ruff check src tests
      - name: Pruebas
        run: python -m pytest
      - name: Proceso completo con datos simulados (semilla fija)
        run: python -m procontrol run
      - name: Los resultados se reproducen
        # los archivos de resultados con valores enteros deben coincidir con los versionados
        run: git diff --exit-code -- outputs/quality/dq_summary.csv outputs/validation/control_metrics.csv outputs/validation/dq_validation.csv
      - name: Construir el sitio
        run: python -m mkdocs build --strict
      - name: Prueba de legibilidad del sitio
        run: python -m procontrol legibilidad site
      - name: Prueba de privacidad del sitio
        run: python -m procontrol privacidad site
