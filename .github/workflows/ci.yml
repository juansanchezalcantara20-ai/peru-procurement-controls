name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check src tests
      - name: Tests
        run: python -m pytest
      - name: Full pipeline (synthetic, seeded)
        run: python -m procontrol run
      - name: Results are reproducible
        # integer-valued results must match the committed ones exactly
        run: git diff --exit-code -- outputs/quality/dq_summary.csv outputs/validation/control_metrics.csv outputs/validation/dq_validation.csv
