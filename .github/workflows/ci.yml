name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check src tests
      - name: Tests
        run: python -m pytest
      - name: Full pipeline (synthetic, seeded)
        run: python -m procontrol run
      - name: Results are reproducible
        run: git diff --stat --exit-code -- outputs ':!outputs/run_metadata.json' || (echo "Committed outputs differ from a fresh run" && exit 1)
