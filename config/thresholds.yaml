# Umbrales normativos y metodológicos que usa el catálogo de controles.
#
# Regla: ningún umbral legal se escribe de memoria dentro del código o del SQL. Cada valor vive
# aquí, junto a su fuente, la fecha en que se revisó y su estado de verificación:
#   verified_primary    - leído en el diario oficial o en la fuente oficial
#   verified_secondary  - confirmado en al menos una fuente secundaria seria (prensa jurídica,
#                         boletín de un estudio de abogados) en la fecha indicada; volver a
#                         contrastar con El Peruano
#   to_verify           - valor plausible usado para que el proyecto corra; DEBE verificarse
#                         antes de sacar cualquier conclusión con datos reales
#   methodological      - no es un umbral legal; es una elección analítica con referencia citada
#
# El proceso imprime cada entrada `to_verify` al iniciar, para que nadie la olvide.

last_reviewed: "2026-11-04"

# Unidad Impositiva Tributaria (soles). Depende del año: el límite de compra menor se expresa en
# UIT «vigentes al momento de la contratación», así que el motor usa la UIT del año de cada compra.
uit_pen:
  2023:
    value: 4950
    source: "DS 309-2022-EF"
    status: to_verify
    checked: null
  2024:
    value: 5150
    source: "DS 309-2023-EF (según la tabla histórica de la UIT de perucontrata.com.pe)"
    status: verified_secondary
    checked: "2026-11-04"
  2025:
    value: 5350
    source: "DS 260-2024-EF (según la tabla histórica de la UIT de perucontrata.com.pe; prensa jurídica cita 8 UIT = S/ 42,800)"
    status: verified_secondary
    checked: "2026-11-04"
  2026:
    value: 5500
    source: "DS 301-2025-EF, El Peruano, diciembre de 2025 (reportado por El Peruano y lpderecho.pe)"
    status: verified_secondary
    checked: "2026-11-04"

# Límite superior de una «contratación menor» (compra fuera de un procedimiento competitivo).
minor_purchase_limit_uit:
  value: 8
  source: >-
    Ley 32069, Ley General de Contrataciones Públicas (vigente desde el 22-04-2025; reglamento
    DS 009-2025-EF, modificado por última vez con DS 001-2026-EF): son contrataciones menores las
    iguales o inferiores a 8 UIT vigentes al momento de contratar. El régimen anterior (TUO de la
    Ley 30225, art. 5.a) usaba la misma cifra de 8 UIT.
  status: verified_secondary   # cifra de la Ley 32069 confirmada en prensa jurídica; la de la Ley 30225 está por verificar
  checked: "2026-11-04"

# Bandas de montos usadas SOLO por el generador de datos simulados para asignar un método de
# selección verosímil. Ningún control las usa. Las bandas reales dependen de la ley de presupuesto
# de cada año y del anexo del reglamento, y son distintas para bienes, servicios y obras.
synthetic_procedure_bands_uit:
  simplified_upper: 400     # to_verify - tope ilustrativo para métodos simplificados o de comparación de precios
  status: to_verify
  source: "Solo ilustrativo; revisar el anexo del reglamento de la Ley 32069 y las leyes de presupuesto 2024/2025"

# Plazo mínimo de presentación de ofertas (días calendario entre la convocatoria y el cierre) por
# método. Los mínimos reales los fija el reglamento en días hábiles y varían por método; los valores
# de abajo son referencias conservadoras para que el control de plazos corra.
min_submission_days:
  default:
    value: 15
    source: "Valor por defecto del indicador R003 de Cardinal (OCP), 15 días enteros; respaldo metodológico"
    status: methodological
  by_method:
    "Licitación pública": { value: 22, status: to_verify, source: "Reglamento de la Ley 32069 / Ley 30225: revisar el mínimo en días hábiles" }
    "Concurso público": { value: 22, status: to_verify, source: "Reglamento de la Ley 32069 / Ley 30225: revisar el mínimo en días hábiles" }
    "Adjudicación simplificada": { value: 8, status: to_verify, source: "Reglamento de la Ley 30225: revisar el mínimo en días hábiles" }
    "Comparación de precios": { value: 5, status: to_verify, source: "Reglamento de la Ley 32069: revisar" }
    "Subasta inversa electrónica": { value: 5, status: to_verify, source: "Reglamento de la Ley 32069 / Ley 30225: revisar" }

# Modificaciones contractuales: aumento acumulado a partir del cual se endurecen los requisitos.
amendment_increase_cap:
  value: 0.25
  source: >-
    El TUO de la Ley 30225, art. 34, permitía prestaciones adicionales de bienes y servicios hasta
    el 25% del monto del contrato original (las obras tenían reglas distintas). La cifra
    equivalente en la Ley 32069 aún no se ha revisado.
  status: to_verify
  checked: null

# Concentración de mercado (índice de Herfindahl-Hirschman sobre el monto adjudicado, escala 0 a 10,000).
hhi_highly_concentrated:
  value: 2500
  source: >-
    Guías de concentraciones horizontales del DOJ y la FTC de EE. UU. (2010): «altamente
    concentrado» por encima de 2,500. Las guías de 2023 lo bajaron a 1,800. Se usa como
    referencia analítica, no como regla legal.
  status: methodological

# Conformidad con Benford en el primer dígito (desviación absoluta media, MAD).
benford_mad_first_digit:
  close: 0.006
  acceptable: 0.012
  marginal: 0.015
  source: "Nigrini, M. (2012). Benford's Law. Wiley: rangos de conformidad de la MAD para el primer dígito"
  status: methodological
