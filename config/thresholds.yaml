# Normative and methodological thresholds used by the control catalog.
#
# Rule: no legal threshold is written from memory inside code or SQL. Every value lives here,
# next to its source, the date it was checked and its verification status:
#   verified_primary    - read in the official gazette / official source
#   verified_secondary  - confirmed in at least one reputable secondary source (legal press,
#                         law-firm bulletin) on the date shown; re-check against El Peruano
#   to_verify           - plausible value used so the project runs; MUST be checked before
#                         drawing any conclusion on real data
#   methodological      - not a legal threshold; an analytical choice with a cited reference
#
# The pipeline prints every `to_verify` entry at start-up so nobody forgets them.

last_reviewed: "2026-11-04"

# Unidad Impositiva Tributaria (PEN). Year-dependent: the minor-purchase limit is expressed in UIT
# "in force at the time of contracting", so the engine joins on the year of each purchase.
uit_pen:
  2023:
    value: 4950
    source: "DS 309-2022-EF"
    status: to_verify
    checked: null
  2024:
    value: 5150
    source: "DS 309-2023-EF (per UIT history table, perucontrata.com.pe)"
    status: verified_secondary
    checked: "2026-11-04"
  2025:
    value: 5350
    source: "DS 260-2024-EF (per UIT history table, perucontrata.com.pe; 8 UIT = S/ 42,800 cited by legal press)"
    status: verified_secondary
    checked: "2026-11-04"
  2026:
    value: 5500
    source: "DS 301-2025-EF, El Peruano, December 2025 (reported by El Peruano news and lpderecho.pe)"
    status: verified_secondary
    checked: "2026-11-04"

# Upper limit for a "contratación menor" (purchase outside a competitive selection procedure).
minor_purchase_limit_uit:
  value: 8
  source: >-
    Ley 32069, Ley General de Contrataciones Públicas (in force since 2025-04-22; regulation
    DS 009-2025-EF, last amended DS 001-2026-EF): minor contracts are those equal to or below
    8 UIT in force at the time of contracting. The earlier regime (TUO Ley 30225, art. 5.a)
    used the same 8 UIT figure.
  status: verified_secondary   # Ley 32069 figure confirmed in legal press; Ley 30225 figure to_verify
  checked: "2026-11-04"

# Amount bands used ONLY by the synthetic generator to assign a plausible selection method.
# They are not used by any control. Real bands depend on the annual budget law and the
# regulation annex and differ for goods, services and works.
synthetic_procedure_bands_uit:
  simplified_upper: 400     # to_verify - illustrative upper bound for simplified/price-comparison methods
  status: to_verify
  source: "Illustrative only; check the regulation annex of Ley 32069 and the 2024/2025 budget laws"

# Minimum submission period (calendar days between call and bid deadline) per method.
# Real minimums are set in business days by the regulation and vary by method; the values below
# are conservative placeholders so the short-period control runs.
min_submission_days:
  default:
    value: 15
    source: "OCP Cardinal indicator R003 default (15 whole days) - methodological fallback"
    status: methodological
  by_method:
    "Licitación pública": { value: 22, status: to_verify, source: "Regulation of Ley 32069 / Ley 30225 - check business-day minimum" }
    "Concurso público": { value: 22, status: to_verify, source: "Regulation of Ley 32069 / Ley 30225 - check business-day minimum" }
    "Adjudicación simplificada": { value: 8, status: to_verify, source: "Regulation of Ley 30225 - check business-day minimum" }
    "Comparación de precios": { value: 5, status: to_verify, source: "Regulation of Ley 32069 - check" }
    "Subasta inversa electrónica": { value: 5, status: to_verify, source: "Regulation of Ley 32069 / Ley 30225 - check" }

# Contract amendments: cumulative increase above which approval requirements tighten.
amendment_increase_cap:
  value: 0.25
  source: >-
    TUO Ley 30225 art. 34 allowed additional goods/services up to 25% of the original contract
    amount (works had different rules). Equivalent figure under Ley 32069 not yet checked.
  status: to_verify
  checked: null

# Market concentration (Herfindahl-Hirschman Index on awarded amount, 0-10,000 scale).
hhi_highly_concentrated:
  value: 2500
  source: >-
    US DOJ/FTC Horizontal Merger Guidelines (2010) "highly concentrated" > 2500. The 2023 Merger
    Guidelines lowered it to 1800. Used here as an analytical reference, not a legal rule.
  status: methodological

# Benford first-digit conformity (Mean Absolute Deviation).
benford_mad_first_digit:
  close: 0.006
  acceptable: 0.012
  marginal: 0.015
  source: "Nigrini, M. (2012). Benford's Law. Wiley - first-digit MAD conformity ranges"
  status: methodological
