site_name: Controles sobre las compras públicas del Perú
site_description: Señales de riesgo en las compras públicas del Perú, explicadas en simple. Señales, nunca acusaciones.
site_url: https://juansanchezalcantara20-ai.github.io/peru-procurement-controls/
repo_url: https://github.com/juansanchezalcantara20-ai/peru-procurement-controls
repo_name: Código en GitHub
copyright: Juan Luis Sánchez Alcántara · Señales, nunca acusaciones
theme:
  name: material
  language: es
  features: [navigation.sections, navigation.top, content.tables]
  palette:
    - scheme: default
      toggle: { icon: material/brightness-7, name: Modo oscuro }
    - scheme: slate
      toggle: { icon: material/brightness-4, name: Modo claro }
extra:
  generator: false
markdown_extensions:
  - tables
  - admonition
  - attr_list
  - md_in_html
  - toc
  - pymdownx.details
  - pymdownx.superfences
nav:
  - Inicio: index.md
  - Las señales:
      - Las señales en lenguaje simple: senales/index.md
      - Compras partidas para no hacer concurso: senales/compras-partidas.md
      - Un solo postor en un concurso abierto: senales/un-solo-postor.md
      - Plazo demasiado corto para ofertar: senales/plazo-corto.md
      - Un proveedor concentra las compras: senales/concentracion.md
      - El mismo ganador una y otra vez: senales/ganador-repetido.md
      - Contratos que crecen demasiado: senales/contratos-que-crecen.md
      - Precios muy por encima de lo normal: senales/precios-atipicos.md
      - Montos que no parecen naturales: senales/montos-poco-naturales.md
      - Demora en la firma del contrato: senales/demora-en-la-firma.md
  - ¿Funciona?: funciona.md
  - De dónde salen los datos: datos.md
  - Glosario: glosario.md
  - Metodología:
      - Metodología: metodologia/index.md
      - Calidad del dato (detalle técnico): metodologia/calidad.md
      - Registro de decisiones: metodologia/decisiones.md
not_in_nav: |
  validation/review_judgments.yaml
