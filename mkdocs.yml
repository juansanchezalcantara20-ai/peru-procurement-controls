site_name: Peru procurement controls
site_description: Continuous-control analytics on Peruvian public procurement (OCDS) - signals, never accusations.
repo_url: https://github.com/juansanchezalcantara20-ai/peru-procurement-controls
theme:
  name: material
  language: es
  features: [navigation.sections, navigation.top, content.tables]
  palette:
    - scheme: default
      toggle: { icon: material/brightness-7, name: Dark mode }
    - scheme: slate
      toggle: { icon: material/brightness-4, name: Light mode }
extra:
  generator: false
markdown_extensions: [tables, admonition, attr_list, md_in_html, toc]
nav:
  - Overview: index.md
  - Data quality: data-quality.md
  - Control catalog:
      - controls/index.md
      - C01 Split purchases: controls/c01.md
      - C02 Single bidder: controls/c02.md
      - C03 Short submission period: controls/c03.md
      - C04 Supplier concentration (HHI): controls/c04.md
      - C05 Repeated winner: controls/c05.md
      - C06 Amendment increase: controls/c06.md
      - C07 Price outlier: controls/c07.md
      - C08 Benford (aggregate): controls/c08.md
      - C09 Award-to-signature time: controls/c09.md
  - Risk score: risk-score.md
  - Trends: trends.md
  - Validation: validation.md
  - Decisiones: metodologia/decisiones.md
not_in_nav: |
  validation/review_judgments.yaml
